[project]
name = "dynamic_infomax"
version = "0.0.0"
description = "Finite-observation optimal priors for sequential decision making."
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/infomax"]
