[project]
name = "dynamic_infomax"
version = "0.0.0"
description = "Finite-observation optimal priors for sequential decision making."
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pytest",
]

[dependency-groups]
dev = [
    "pypdf",      # read PDFs in resources/ without a system-level poppler install
    "daft-pgm",   # plate-notation diagrams in diagrams/ (imports as `daft`)
    "code2flow>=2.5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/infomax"]
