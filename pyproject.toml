[project]
name = "dynamic_infomax"
version = "0.0.0"
description = "Finite-observation optimal priors for sequential decision making."
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pytest",
    "numba>=0.68.1",
]

[dependency-groups]
dev = [
    "pypdf",      # read PDFs in resources/ without a system-level poppler install
    "daft-pgm",   # plate-notation diagrams in diagrams/ (imports as `daft`)
    "code2flow>=2.5.1",
    "pypdfium2>=5.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/infomax"]

[tool.pytest.ini_options]
markers = [
    "slow: sweep-level spec-002 tests (D-sweeps, the atomic path); run with `pytest -m slow`",
]
addopts = "-m 'not slow'"
